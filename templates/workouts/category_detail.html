{% extends 'layouts/base-presentation.html' %}
{% block content %}

<div class="container mt-8">
  <h1>{{category.name}} - all exercises:</h1>
  <div class="row g-3">
    {% for exercise in category.exercises.all %}
    <div class="col-lg-4 mb-4">
      <div class="info-horizontal bg-gray-100 border-radius-xl p-5 h-100">
        <div class="icon">
        </div>
        <h3>{{exercise.name}}</h3>
        <div class="description">
        </div>
        <a href="{% url 'workouts:category-detail' pk=category.id %}" class="btn bg-gradient-primary w-auto me-1 mb-0 ">
          <i class="text-sm ">Czytaj dalej</i>
        </a>
      </div>>
    </div>
    {% empty %}
      <div class="col-12 text-center mt-5">
        <h4>Brak ćwiczeń w bazie.</h4>
      </div>
    {% endfor %}
  </div>
</div>

{% endblock %}
